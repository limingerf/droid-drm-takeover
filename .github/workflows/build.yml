name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ════════════════════════════════════════════════════════════════════
  # 1) 交叉编译 aarch64 工具
  #    目标架构只有 aarch64：touchdraw.c 含 ARM64 内联汇编（dc civac/dsb sy
  #    做缓存维护），x86 原生全量构建编得过但上设备 SIGILL，没有意义。
  # ════════════════════════════════════════════════════════════════════
  aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 配置 multiarch apt 源
        run: |
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list
          printf 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main universe\ndeb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main universe\ndeb [arch=amd64] http://security.ubuntu.com/ubuntu noble-security main universe\n' \
            | sudo tee /etc/apt/sources.list.d/amd64.list
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe\n' \
            | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config gcc-aarch64-linux-gnu \
            libdrm-dev:arm64 libwayland-dev:arm64 libudev-dev:arm64

      - name: 交叉编译
        run: |
          # ★ Makefile 在**解析期**用 $(shell pkg-config ...) 求值，
          #   所以交叉编译必须走环境变量；`make PKG_CFLAGS=...` 是无效的。
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          make -j"$(nproc)" CC=aarch64-linux-gnu-gcc

      - name: 校验每一个产物都是 aarch64
        run: |
          set -eu
          fail=0
          n=0
          for f in bin/*; do
            n=$((n+1))
            desc=$(file -b "$f")
            case "$desc" in
              *"ARM aarch64"*) ;;
              *) echo "::error file=$f::不是 aarch64: $desc"; fail=1 ;;
            esac
            # 共享库要额外确认是 shared object
            case "$f" in
              *.so) case "$desc" in *"shared object"*) ;; *)
                      echo "::error file=$f::应为 shared object: $desc"; fail=1 ;;
                    esac ;;
            esac
          done
          echo "共校验 $n 个产物"
          [ "$n" -ge 24 ] || { echo "::error::产物数量异常（$n < 24），可能有目标没编出来"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

      # ★ 必须在**独立目录**里做，不能用 `make clean && make runtime` 直接跑在
      #   bin/ 上 —— 那会把刚编好的完整 bin/ 覆盖成 6 个 runtime 工具，
      #   而下一步的 upload-artifact 就会把这 6 个传出去，APK job 拿到的
      #   payload/bin 只有 6 个文件。（早期版本正是这么坏的。）
      - name: 校验 runtime 子集可独立构建
        run: |
          set -eu
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          make -j"$(nproc)" runtime CC=aarch64-linux-gnu-gcc BIN=bin-rt BLD=build-rt
          for t in kwinwrap setbright setprop crtcstate connprops atomicspy.so; do
            [ -f "bin-rt/$t" ] || { echo "::error::make runtime 缺少 bin-rt/$t"; exit 1; }
          done
          # runtime 是脚本硬依赖的最小集：多出探针说明分组错了
          extra=$(ls bin-rt | grep -vE '^(kwinwrap|setbright|setprop|crtcstate|connprops|atomicspy\.so)$' || true)
          [ -z "$extra" ] || { echo "::error::make runtime 混进了非 runtime 目标: $extra"; exit 1; }
          n=$(ls -1 bin-rt | wc -l)
          echo "runtime 子集: $n 个"
          # 顺带确认完整 bin/ 没被动过
          nfull=$(ls -1 bin | wc -l)
          echo "完整 bin/: $nfull 个"
          [ "$nfull" -ge 24 ] || { echo "::error::完整 bin/ 被破坏了（$nfull < 24）"; exit 1; }
          rm -rf bin-rt build-rt

      - uses: actions/upload-artifact@v4
        with:
          name: tools-aarch64
          path: bin/

  # ════════════════════════════════════════════════════════════════════
  # 2) 脚本门禁
  #    所有 .sh 都要同时跑在安卓 /system/bin/sh（mksh）和容器 /bin/sh
  #    （dash/bash）上，所以一律按 POSIX 检查。
  # ════════════════════════════════════════════════════════════════════
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 dash
        run: sudo apt-get update && sudo apt-get install -y dash

      - name: dash -n 语法检查
        run: |
          set -eu
          fail=0; n=0
          for f in $(find . -name '*.sh' -not -path './.git/*' | sort); do
            n=$((n+1))
            if out=$(dash -n "$f" 2>&1); then
              echo "ok   $f"
            else
              echo "::error file=$f::$out"
              fail=1
            fi
          done
          echo "共检查 $n 个脚本"
          exit $fail

      - name: 扫描非 POSIX 构造
        run: |
          set -eu
          # 这些是真实踩过的坑：数组、[[ ]]、${var//}、$'...'、process substitution。
          # 注意排除注释行。
          fail=0
          while IFS= read -r f; do
            # 去掉注释行后再扫
            if grep -vE '^[[:space:]]*#' "$f" | grep -nE '\[\[|\$\{[A-Za-z_][A-Za-z0-9_]*//|\$\x27|declare -|function [a-z]|=~|<\(|>\(' >/dev/null 2>&1; then
              echo "::error file=$f::含非 POSIX 构造"
              grep -vE '^[[:space:]]*#' "$f" | grep -nE '\[\[|\$\{[A-Za-z_][A-Za-z0-9_]*//|\$\x27|declare -|function [a-z]|=~|<\(|>\(' || true
              fail=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' | sort)
          exit $fail

      # dash -n 只能证明"语法合法"。它查不出调用了不存在的函数、或者调用了
      # 目标环境上不存在的命令 —— 而那类错误只会在设备上执行到那一行时才炸，
      # 且往往炸在接管中（没有回显）或返回安卓的路径上。
      # 这个检查抓到过 `fuser -k`（安卓 toybox 没有，兜底路径从未生效）。
      - name: 静态检查（未定义函数 / 缺失命令 / bash 构造）
        run: |
          set -eu
          python3 tools/lint/shell-lint.py

  # ════════════════════════════════════════════════════════════════════
  # 3) APK
  #    ubuntu runner 自带 Android SDK。构建脚本不用 Gradle（手工走
  #    aapt2 → javac → d8 → zipalign → apksigner），所以只需要 SDK 工具。
  #
  #    ★ needs: aarch64 —— APK 要把编译好的 aarch64 工具打进
  #      assets/payload/bin/。第一次跑这个 workflow 时漏了这层依赖，
  #      结果 APK 里只有脚本、一个二进制都没有，上设备根本跑不起来。
  # ════════════════════════════════════════════════════════════════════
  apk:
    runs-on: ubuntu-24.04
    needs: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: 取回 aarch64 工具
        uses: actions/download-artifact@v4
        with:
          name: tools-aarch64
          path: bin/

      - name: 确认 bin/ 就位
        run: |
          set -eu
          n=$(ls -1 bin/ | wc -l)
          echo "bin/ 里有 $n 个文件"
          ls -1 bin/
          [ "$n" -ge 24 ] || { echo "::error::bin/ 不完整（$n < 24）"; exit 1; }
          [ -f bin/kwinwrap ] || { echo "::error::缺少 bin/kwinwrap"; exit 1; }

      - name: 定位 Android SDK
        run: |
          set -eu
          for c in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk; do
            if [ -n "${c:-}" ] && [ -d "$c/build-tools" ]; then
              echo "ANDROID_HOME=$c" >> "$GITHUB_ENV"
              ls "$c/build-tools"
              ls "$c/platforms" 2>/dev/null || true
              exit 0
            fi
          done
          echo "::error::runner 上没有可用的 Android SDK"
          exit 1

      - name: 构建 APK
        run: |
          set -eu
          chmod +x android/build.sh
          sh android/build.sh
          ls -l android/build/*.apk

      - name: 校验 APK
        run: |
          set -eu
          APK=android/build/drmswitch.apk
          [ -f "$APK" ] || { echo "::error::没产出 $APK"; exit 1; }

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"

          echo "── badging ──"
          "$BT/aapt2" dump badging "$APK" | head -20

          echo "── 签名 ──"
          "$BT/apksigner" verify --print-certs "$APK"

          echo "── payload ──"
          unzip -l "$APK" | grep 'assets/payload/' | wc -l

          # payload 必须真的打进去了，而且要包含编译产物
          for f in core/switch.sh linux/drm-switch.sh linux/session-up.sh \
                   display/desk-takeover.sh android/enter.sh \
                   bin/kwinwrap bin/setbright bin/setprop bin/atomicspy.so; do
            unzip -l "$APK" | grep -q "assets/payload/$f" \
              || { echo "::error::APK 里没有 assets/payload/$f"; exit 1; }
          done

          nb=$(unzip -l "$APK" | grep -c 'assets/payload/bin/' || true)
          echo "payload/bin/ 条目数：$nb"
          [ "$nb" -ge 24 ] || { echo "::error::payload/bin/ 不完整（$nb < 24）"; exit 1; }

          # 对齐
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null && echo "zipalign 4 字节对齐 OK"

      # 上面那些断言只证明"文件在 APK 里"。这一步证明"到了设备上能用"：
      # 手写的 USTAR 编码器过一遍真实 tar 往返（toybox tar 要能读）、
      # LOCKDOWN 落地后权限对不对（bin/kwinwrap 是被直接 exec 的，
      # 644 就 Permission denied）、换行符有没有被破坏（CRLF 会让
      # `#!/bin/sh\r` 变成 "not found"）。
      # 它抓到过一次真问题：LOCKDOWN 逐个目录列举 chmod，新增 tools/ 后漏掉，
      # device-acceptance.sh 落地是 644 而仓库里是 755。
      - name: 校验 payload 落地链路（tar 往返 + 权限 + 换行）
        run: |
          set -eu
          sh tools/verify/verify-apk-payload.sh android/build/drmswitch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: drmswitch-apk
          path: android/build/drmswitch.apk

  # ════════════════════════════════════════════════════════════════════
  # 4) 蓝牙 HCI 桥（HIDL 客户端，bionic）
  #
  #    ★ 为什么**不能**并进 job 1：
  #      job 1 出的是跑在 drm 容器里的 glibc 工具；而这个桥必须跑在
  #      **安卓侧** —— 它要访问 hwservicemanager（/dev/hwbinder）和 vendor
  #      HAL 的 /vendor/lib64/android.hardware.bluetooth@1.0.so，而安卓用户态
  #      是 bionic。glibc 二进制在安卓上根本起不来。所以它单独用 NDK 编。
  #
  #    runner（ubuntu-24.04）自带 Android SDK/NDK，环境变量是
  #    ANDROID_NDK_LATEST_HOME。bt/build.sh 自己会探测 NDK 并挑可用的最高
  #    API level（不写死：runner 镜像换代时写死的 API 会直接找不到编译器）。
  #
  #    ★ 这个 job 跑在**宿主机**上的还有 h4framing 单测 —— H4 拆包和 pty
  #      短写这两段逻辑是"内核 H4 解析器一旦跑偏就永久哑"的入口，
  #      能在宿主机断言的事绝不带到设备上去试。
  # ════════════════════════════════════════════════════════════════════
  btbridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 定位 Android NDK
        run: |
          set -eu
          for c in "${ANDROID_NDK_LATEST_HOME:-}" "${ANDROID_NDK_HOME:-}" \
                   "${ANDROID_NDK_ROOT:-}" /usr/local/lib/android/sdk/ndk/*; do
            if [ -n "$c" ] && [ -d "$c/toolchains/llvm" ]; then
              echo "NDK=$c" >> "$GITHUB_ENV"
              echo "用 NDK: $c"
              ls "$c"
              exit 0
            fi
          done
          echo "::error::runner 上没有可用的 Android NDK"
          exit 1

      - name: 构建（含 h4framing 宿主机单测）
        run: sh bt/build.sh

      - name: 校验产物
        run: |
          set -eu
          B=bt/out/bthci-bridge
          [ -f "$B" ] || { echo "::error::没产出 $B"; exit 1; }

          desc=$(file -b "$B")
          echo "file: $desc"
          case "$desc" in
            *"ARM aarch64"*) ;;
            *) echo "::error file=$B::不是 aarch64: $desc"; exit 1 ;;
          esac

          # NEEDED 只允许 bionic 自带的三个。多出 libc++_shared.so /
          # libhidlbase.so / libbinder_ndk.so 说明构建方式变了 —— 那些库在
          # 安卓侧能不能按我们的假设加载是另一回事，必须在这里挡住。
          deps=$(readelf -d "$B" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | sort)
          echo "NEEDED:"; echo "$deps"
          for d in $deps; do
            case "$d" in
              libdl.so|libm.so|libc.so) ;;
              *) echo "::error file=$B::依赖了预期外的库: $d"; exit 1 ;;
            esac
          done

          # 16K 页设备（安卓 15+）上，段对齐小于 16K 的 PIE 会加载失败。
          # -Wl,-z,max-page-size=16384 的判据就是 LOAD 段 align 字段。
          readelf -lW "$B" | awk '$1=="LOAD" {print "LOAD align:", $NF}' | sort -u

          ls -l "$B"

      - uses: actions/upload-artifact@v4
        with:
          name: btbridge-aarch64
          path: bt/out/bthci-bridge
