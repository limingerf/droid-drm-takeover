# display/powerdevil-wayland-env.conf — 给 plasma-powerdevil 补 Wayland 环境
#
# 装到：$HOME/.config/systemd/user/plasma-powerdevil.service.d/10-wayland-env.conf
#
# ══════════════════════════════════════════════════════════════════════
# 为什么需要
# ══════════════════════════════════════════════════════════════════════
# 本项目的桌面是**绕过 startplasma-wayland 手工起**的
# （display/desk-takeover.sh → core/lib/display.sh 直接 exec kwin_wayland），
# 所以从来没有 `systemctl --user import-environment` 这一步，
# systemd --user 的环境里**没有** WAYLAND_DISPLAY。
#
# PowerDevil 是 Qt Wayland 客户端（org_kde_powerdevil 一启动就
# QWaylandClientExtensionTemplate 去连 kde_external_brightness_v1），
# 缺了 WAYLAND_DISPLAY 的后果实测是**直接 SIGABRT**：
#   systemctl --user start plasma-powerdevil.service
#     → Job ... failed because a fatal signal was delivered
#       code=killed, signal=ABRT
#   journal: Failed to create wl_display (No such file or directory)
#            Could not load the Qt platform plugin "wayland"
# 手工前台带 WAYLAND_DISPLAY 跑则一切正常（只是被 timeout 杀掉）。
#
# ⇒ 把 socket 名显式写进 unit 环境，不依赖 startplasma 的 import-environment。
#
# ★ socket 名不要写死 wayland-0：本项目 KWin 是用 `--socket=taketest` 起的
#   （core/lib/display.sh 里的 $_sock），实测名字就是 taketest。
#   display/powerdevil-enable.sh 会**运行时探测**再填进来。
#
# ══════════════════════════════════════════════════════════════════════

[Service]
Environment=WAYLAND_DISPLAY=@WAYLAND_DISPLAY@
Environment=QT_QPA_PLATFORM=wayland
Environment=XDG_SESSION_TYPE=wayland
Environment=XDG_CURRENT_DESKTOP=KDE
